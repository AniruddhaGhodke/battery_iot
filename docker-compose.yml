# Local stack: database, MQTT ingest worker, web dashboard.
# Production runs from deploy/docker-compose.yml on the droplet.
#
#   docker compose up -d --build                    db + web (no ingest), dashboard on http://localhost:3100
#   docker compose --profile ingest up -d --build   also ingest; only while the server's ingest is stopped
#   docker compose up -d db                         only the database, for `npm run dev` on the host
#
# Ingest is opt-in because the server's ingest uses the same MQTT_CLIENT_ID:
# two of them kick each other off the broker.
#
# Settings come from .env.local (same file `npm run dev` uses). Memory caps
# match the 1 GB droplet budget in PLAN.md, so problems show up here first.

name: battery-iot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  env_file:
    - path: .env.local
      required: false

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms_local}
      NO_TS_TUNE: "true"
    # Tuned for ~320 MB. See PLAN.md section 3.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=30
      -c max_worker_processes=8
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c timescaledb.max_background_workers=4
      -c timescaledb.telemetry_level=off
      -c wal_buffers=4MB
      -c max_wal_size=512MB
      -c min_wal_size=64MB
      -c checkpoint_timeout=15min
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Host access for `npm run dev` and psql. Localhost only.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m
    logging: *logging

  ingest:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    image: ghcr.io/aniruddhaghodke/battery-iot-ingest:${TAG:-latest}
    profiles: [ingest]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bms:${POSTGRES_PASSWORD:-bms_local}@db:5432/bms
      STATUS_PORT: "3101"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s
    mem_limit: 150m
    logging: *logging

  web:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ghcr.io/aniruddhaghodke/battery-iot-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bms:${POSTGRES_PASSWORD:-bms_local}@db:5432/bms
      INGEST_URL: http://ingest:3101
    depends_on:
      # ingest applies the migrations, so it goes first when it runs. Without
      # it, run `npm run migrate` once on a new database.
      db:
        condition: service_healthy
      ingest:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    mem_limit: 300m
    logging: *logging

volumes:
  dbdata:
