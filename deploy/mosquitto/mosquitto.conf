# Private MQTT broker on the droplet. The packs publish here, ingest subscribes.
#
# Plain TCP on 1883, as the hardware spec (ServerSide.docx) asks; TLS on 8883
# comes later (TODO 7). Port 80 is Caddy's, so MQTT cannot use it.
#
# Logins are in auth/passwd, which exists only on the droplet and is never
# committed. Create or change one (see README, "Broker accounts"):
#   docker compose run --rm mosquitto mosquitto_passwd -b /mosquitto/auth/passwd <user> <password>
#
# The acl file is mounted read-only and owned by the deploy user, so 2.0.22
# logs a "future versions will refuse" permissions warning for it. Harmless
# at this pinned version; recheck before upgrading the image.

per_listener_settings false

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# Ingest's persistent session survives a broker restart, and QoS 1 messages
# queue for it while it is down. 10 000 messages is over an hour at two packs
# publishing every second, and a few MB of RAM.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 10000
# Forget sessions of clients gone this long (old device client ids).
persistent_client_expiration 14d

# A pack reading is ~2 KB; anything this big is not ours.
message_size_limit 65536

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
